services:
  - type: web
    name: conceptsin5-api
    env: python
    region: oregon          # Change to 'singapore' if you want lower latency from India
    plan: free              # Upgrade to 'starter' ($7/mo) to eliminate cold starts
    branch: main
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm install && npm run build && cd ../backend &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --run-syncdb &&
      python populate_data.py
    startCommand: gunicorn backend.wsgi:application --config gunicorn.conf.py --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    autoDeploy: true

    # ─── Environment Variables ──────────────────────────────────
    # Set SECRET_KEY, DATABASE_URL, and API keys in Render dashboard (not here)
    # Only non-sensitive config is listed here
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: conceptsin5-api.onrender.com,conceptsin5.onrender.com,api.conceptsin5.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://conceptsin5.com,https://www.conceptsin5.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://conceptsin5.com,https://www.conceptsin5.com,https://conceptsin5-api.onrender.com
      - key: CMS_ADMIN_USERNAME
        value: om
      - key: GUNICORN_WORKERS
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.0"

      # ─── Set these in Render Dashboard (never commit real values) ───
      # SECRET_KEY         → generate via: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      # DATABASE_URL       → get from Avian dashboard: postgresql://user:pass@host/dbname?sslmode=require
      # CMS_ADMIN_PASSWORD → your admin password (0m@123)
      # YOUTUBE_API_KEY    → from Google Cloud Console
      # YOUTUBE_CHANNEL_ID → your YouTube channel ID
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET → from Cloudinary dashboard
      # SENTRY_DSN         → from sentry.io project settings
